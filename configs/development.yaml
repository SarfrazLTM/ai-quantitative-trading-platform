# ============================================================
# Quantitative Trading Platform
# Local Development Configuration
# ============================================================

application:
  name: quant-platform
  environment: development
  log_level: DEBUG


market_data:
  provider: binance_futures

  symbols:
    - BTCUSDT
    - ETHUSDT

  timeframes:
    - 15m
    - 30m
    - 1h

  historical:
    enabled: true
    lookback_days: 30

  realtime:
    enabled: false


features:
  enabled: true

  validation:
    enabled: true
    minimum_rows: 100


models:
  model_registry:
    path: ./artifacts/models

  inference:
    enabled: true

  calibration:
    enabled: true


strategy:
  enabled: true
  strategies: []


portfolio:
  enabled: true

  defaults:
    initial_capital: 10000.0
    risk_per_trade: 0.0025
    max_portfolio_risk: 0.05
    max_drawdown: 0.20
    max_open_positions: 10


risk:
  enabled: true

  exposure:
    max_portfolio_exposure: 1.0
    max_symbol_exposure: 0.20
    max_open_positions: 10
    one_position_per_symbol: true

  drawdown:
    reduced_threshold: 0.10
    blocked_threshold: 0.20
    reduced_risk_multiplier: 0.50


backtesting:
  enabled: true

  costs:
    fee_rate: 0.0005
    slippage_bps: 0.0


signals:
  enabled: true

  integrity:
    algorithm: SHA-256


execution:
  enabled: true

  queue:
    backend: memory

  webhook:
    timeout_seconds: 5

  retry:
    max_attempts: 3
    initial_delay_seconds: 1.0
    max_delay_seconds: 10.0
    backoff_multiplier: 2.0

  idempotency:
    backend: memory


storage:
  mongodb:
    enabled: false
    database: quant_platform_dev

  redis:
    enabled: false
    database: 0


observability:
  logging:
    enabled: true
    level: DEBUG

  metrics:
    enabled: false