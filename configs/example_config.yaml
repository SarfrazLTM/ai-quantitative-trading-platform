# ============================================================
# Quantitative Trading Platform
# Example Configuration
#
# This file contains safe example values only.
# Do not place API keys, passwords, tokens, or production
# credentials in this file.
# ============================================================


# ------------------------------------------------------------
# Application
# ------------------------------------------------------------
application:
  name: quant-platform
  environment: development
  log_level: INFO


# ------------------------------------------------------------
# Market Data
# ------------------------------------------------------------
market_data:
  provider: binance_futures

  symbols:
    - BTCUSDT
    - ETHUSDT

  timeframes:
    - 15m
    - 30m
    - 1h

  historical:
    enabled: true
    lookback_days: 365

  realtime:
    enabled: true


# ------------------------------------------------------------
# Feature Engineering
# ------------------------------------------------------------
features:
  enabled: true

  validation:
    enabled: true
    minimum_rows: 100


# ------------------------------------------------------------
# Machine Learning
# ------------------------------------------------------------
models:
  model_registry:
    path: ./artifacts/models

  inference:
    enabled: true

  calibration:
    enabled: true


# ------------------------------------------------------------
# Strategy
# ------------------------------------------------------------
strategy:
  enabled: true

  # Public example only.
  # Proprietary strategy definitions should remain private.
  strategies: []


# ------------------------------------------------------------
# Portfolio
# ------------------------------------------------------------
portfolio:
  enabled: true

  defaults:
    initial_capital: 10000.0
    risk_per_trade: 0.0025
    max_portfolio_risk: 0.05
    max_drawdown: 0.20
    max_open_positions: 10


# ------------------------------------------------------------
# Risk Management
# ------------------------------------------------------------
risk:
  enabled: true

  exposure:
    max_portfolio_exposure: 1.0
    max_symbol_exposure: 0.20
    max_open_positions: 10
    one_position_per_symbol: true

  drawdown:
    reduced_threshold: 0.10
    blocked_threshold: 0.20
    reduced_risk_multiplier: 0.50


# ------------------------------------------------------------
# Backtesting
# ------------------------------------------------------------
backtesting:
  enabled: true

  costs:
    fee_rate: 0.0005
    slippage_bps: 0.0


# ------------------------------------------------------------
# Signal Generation
# ------------------------------------------------------------
signals:
  enabled: true

  integrity:
    algorithm: SHA-256


# ------------------------------------------------------------
# Execution
# ------------------------------------------------------------
execution:
  enabled: true

  queue:
    backend: memory

  webhook:
    timeout_seconds: 10

  retry:
    max_attempts: 5
    initial_delay_seconds: 1.0
    max_delay_seconds: 60.0
    backoff_multiplier: 2.0

  idempotency:
    backend: memory


# ------------------------------------------------------------
# Storage
# ------------------------------------------------------------
storage:
  mongodb:
    enabled: false
    database: quant_platform

  redis:
    enabled: false
    database: 0


# ------------------------------------------------------------
# Observability
# ------------------------------------------------------------
observability:
  logging:
    enabled: true
    level: INFO

  metrics:
    enabled: false